openapi: 3.0.3
info:
  title: WordCount Service API
  version: 1.0.0
  description: Word counting over HTTP. Contract source mission/input-spec.md (task 2).
paths:
  /count:
    post:
      tags: [count]
      operationId: count
      summary: Count words in text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRequest'
      responses:
        '200':
          description: Word count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          description: Empty or missing text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /count/health:
    get:
      tags: [count]
      operationId: health
      summary: Service health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    CountRequest:
      type: object
      properties:
        text:
          type: string
          description: Arbitrary text whose words are counted
    CountResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of words (maximal runs of non-whitespace)
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
